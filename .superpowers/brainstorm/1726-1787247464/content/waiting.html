<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direção visual escolhida</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #050705; color: #f5fff5; }
    main { width: min(560px, calc(100% - 48px)); border: 1px solid #39ff14; padding: 32px; box-shadow: 0 0 36px #39ff1426; }
    p { color: #aab7aa; line-height: 1.6; }
    strong { color: #39ff14; letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <strong>Direção B confirmada</strong>
    <h1>Gym Console</h1>
    <p>A seleção visual foi registrada. A definição das histórias continua na conversa do Nexus Studio.</p>
  </main>
</body>
</html>
